# Portfolio apps (frontend + backend Helm charts from this repo).
# The ECR repository, region and the backend IRSA role ARN are cluster-specific, so they are
# built from the Argo CD cluster Secret (created by the CD pipeline) instead of being in Git.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: portfolio
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  portfolio/cluster: "true"
          - list:
              elements:
                - app: frontend
                  path: ArgoCD/frontend/helm_chart
                - app: backend
                  path: ArgoCD/backend/helm_chart
  template:
    metadata:
      name: '{{ .app }}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/sahar449/my-portfolio.git
        targetRevision: HEAD
        path: '{{ .path }}'
      destination:
        server: '{{ .server }}'
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
        # Sync waves don't order apps generated by ApplicationSets: the backend may sync
        # before the CSI driver CRDs exist, the frontend before the ALB webhook is up.
        # Retry until the add-ons are ready instead of failing the sync.
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
  templatePatch: |
    spec:
      source:
        helm:
          parameters:
            - name: app.image.repository
              value: {{ .metadata.annotations.aws_account_id }}.dkr.ecr.{{ .metadata.annotations.aws_region }}.amazonaws.com/{{ .app }}
            - name: region
              value: {{ .metadata.annotations.aws_region | quote }}
            {{- if eq .app "backend" }}
            - name: secrets.accountNumber
              value: {{ .metadata.annotations.aws_account_id | quote }}
            {{- end }}
