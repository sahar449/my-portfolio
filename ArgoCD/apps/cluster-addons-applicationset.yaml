# Cluster add-ons managed by Argo CD (drift detection + self-heal).
# Each list element = one Helm chart; its values live in ArgoCD/addons/<addon>/values.yaml.
# Cluster-specific values (account ID, region, cluster name, VPC ID) come from the Argo CD
# cluster Secret that the CD pipeline creates, so they are never stored in Git:
#   irsaRole      - IAM role name; "{cluster}" is replaced with the cluster name
#   clusterParams - <helm parameter>: <annotation key on the cluster Secret>
# IAM (IRSA) roles for these add-ons stay in Terraform (infra/modules/iam).
# Core add-ons that must exist before Argo can run (vpc-cni, kube-proxy, coredns) and
# amazon-cloudwatch-observability stay as EKS managed add-ons in Terraform.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  portfolio/cluster: "true"
          - list:
              elements:
                - addon: aws-load-balancer-controller
                  ns: kube-system
                  repoURL: https://aws.github.io/eks-charts
                  chart: aws-load-balancer-controller
                  version: 1.8.3
                  irsaRole: eks-lb-controller-role
                  clusterParams:
                    clusterName: cluster_name
                    region: aws_region
                    vpcId: vpc_id
                - addon: external-dns
                  ns: external-dns
                  repoURL: https://kubernetes-sigs.github.io/external-dns/
                  chart: external-dns
                  version: 1.23.0
                  irsaRole: "{cluster}-external-dns-role"
                  clusterParams:
                    txtOwnerId: cluster_name
                - addon: metrics-server
                  ns: kube-system
                  repoURL: https://kubernetes-sigs.github.io/metrics-server/
                  chart: metrics-server
                  version: 3.14.0
                  irsaRole: ""
                  clusterParams: {}
                - addon: kube-state-metrics
                  ns: kube-system
                  repoURL: https://prometheus-community.github.io/helm-charts
                  chart: kube-state-metrics
                  version: 9.0.0
                  irsaRole: ""
                  clusterParams: {}
                # Includes the secrets-store-csi-driver chart as a dependency
                - addon: secrets-store-csi-driver-provider-aws
                  ns: kube-system
                  repoURL: https://aws.github.io/secrets-store-csi-driver-provider-aws
                  chart: secrets-store-csi-driver-provider-aws
                  version: 3.1.4
                  irsaRole: ""
                  clusterParams: {}
  template:
    metadata:
      name: '{{ .addon }}'
      namespace: argocd
    spec:
      project: default
      # Real sources (with cluster-specific Helm parameters) are set in templatePatch below
      sources: []
      destination:
        server: '{{ .server }}'
        namespace: '{{ .ns }}'
      # Webhook certs are generated by Helm on every render; without this Argo would
      # always report OutOfSync (false drift) and rotate the certs on each self-heal.
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - '.webhooks[]?.clientConfig.caBundle'
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - '.webhooks[]?.clientConfig.caBundle'
        - kind: Secret
          name: aws-load-balancer-tls
          jsonPointers:
            - /data
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
  templatePatch: |
    spec:
      sources:
        - repoURL: {{ .repoURL | quote }}
          chart: {{ .chart | quote }}
          targetRevision: {{ .version | quote }}
          helm:
            releaseName: {{ .addon | quote }}
            valueFiles:
              - $values/ArgoCD/addons/{{ .addon }}/values.yaml
            {{- if or .irsaRole .clusterParams }}
            parameters:
              {{- if .irsaRole }}
              - name: serviceAccount.annotations.eks\.amazonaws\.com/role-arn
                value: arn:aws:iam::{{ .metadata.annotations.aws_account_id }}:role/{{ .irsaRole | replace "{cluster}" .metadata.annotations.cluster_name }}
              {{- end }}
              {{- range $param, $key := .clusterParams }}
              - name: {{ $param }}
                value: {{ index $.metadata.annotations $key | quote }}
              {{- end }}
            {{- end }}
        - repoURL: https://github.com/sahar449/my-portfolio.git
          targetRevision: HEAD
          ref: values
