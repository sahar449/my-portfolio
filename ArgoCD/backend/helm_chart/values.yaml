app:
  name: backend
  namespace: default
  replicas: 2
  image:
    repository: "634647866665.dkr.ecr.us-west-2.amazonaws.com/backend"
    tag: 4642821831e5f1f68f8f501fe7155b872eb4c6d9
    pullPolicy: Always
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  nodeSelector:
    role: backend
hpa:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
pdb:
  minAvailable: 1
service:
  type: ClusterIP
  port: 5002
  targetPort: 5002
redis:
  providerClassName: redis-secrets
  k8sSecretName: redis-credentials
  mountPath: /mnt/redis-secret
secrets:
  serviceAccountName: flask-app-sa
  providerClassName: rds-secrets
  mountPath: /mnt/rds-secret
  k8sSecretName: rds-credentials
  accountNumber: "634647866665"
hooks:
  # Enable pre-install/pre-upgrade + post-install/post-upgrade Job hooks
  enabled: false
resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    # headroom for the injected OpenTelemetry Python agent
    memory: 256Mi
    cpu: 200m
