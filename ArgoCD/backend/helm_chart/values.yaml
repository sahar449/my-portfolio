# Set by the portfolio ApplicationSet from the Argo CD cluster Secret
region: ""
app:
  name: backend
  namespace: default
  replicas: 2
  image:
    # Set by the portfolio ApplicationSet: <account>.dkr.ecr.<region>.amazonaws.com/backend
    repository: ""
    tag: 90a4853f5ffb565213e1b73f5720e49b92b5ca4b
    pullPolicy: Always
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  nodeSelector:
    role: backend
hpa:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
pdb:
  minAvailable: 1
service:
  type: ClusterIP
  port: 5002
  targetPort: 5002
redis:
  providerClassName: redis-secrets
  # Secrets Manager secret name (Terraform: infra/modules/elasticache redis_secret_name)
  awsSecretName: redis-creds
  k8sSecretName: redis-credentials
  mountPath: /mnt/redis-secret
secrets:
  serviceAccountName: flask-app-sa
  providerClassName: rds-secrets
  # Secrets Manager secret name (Terraform: secret_name in infra/terraform.tfvars)
  awsSecretName: rds-creds
  mountPath: /mnt/rds-secret
  k8sSecretName: rds-credentials
  # Set by the portfolio ApplicationSet from the Argo CD cluster Secret
  accountNumber: ""
hooks:
  # Enable pre-install/pre-upgrade + post-install/post-upgrade Job hooks
  enabled: false
resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    # headroom for the injected OpenTelemetry Python agent
    memory: 256Mi
    cpu: 200m
