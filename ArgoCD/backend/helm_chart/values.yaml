app:
  name: backend
  namespace: default
  replicas: 2
  image:
    repository: "634647866665.dkr.ecr.us-west-2.amazonaws.com/backend"
    tag: bf15249e806a5d9dcb30f09b8cd39633300aef02
    pullPolicy: Always
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  nodeSelector:
    role: backend
hpa:
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
pdb:
  minAvailable: 1
service:
  type: ClusterIP
  port: 5002
  targetPort: 5002
redis:
  providerClassName: redis-secrets
  k8sSecretName: redis-credentials
  mountPath: /mnt/redis-secret
secrets:
  serviceAccountName: flask-app-sa
  providerClassName: rds-secrets
  mountPath: /mnt/rds-secret
  k8sSecretName: rds-credentials
  accountNumber: "634647866665"
resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 128Mi
    cpu: 100m
