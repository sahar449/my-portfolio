<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sahar Bittman — Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* ── Header / Profile ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 40px;
      background: linear-gradient(160deg, #1a1f2e, #0f1117);
      border-bottom: 1px solid #2a2f3e;
    }

    .hero img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #4f8ef7;
      margin-bottom: 20px;
    }

    .hero h1 { font-size: 2rem; color: #ffffff; }
    .hero p.title { color: #4f8ef7; margin: 6px 0 12px; font-size: 1.1rem; }
    .hero p.bio { max-width: 520px; text-align: center; color: #a0a8c0; line-height: 1.6; }

    .links { display: flex; gap: 16px; margin-top: 20px; }
    .links a {
      color: #4f8ef7;
      text-decoration: none;
      border: 1px solid #4f8ef7;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .links a:hover { background: #4f8ef7; color: #fff; }

    /* ── Certificates ── */
    .section {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .section h2 {
      font-size: 1.4rem;
      color: #ffffff;
      margin-bottom: 28px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2f3e;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1a1f2e;
      border: 1px solid #2a2f3e;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-4px); border-color: #4f8ef7; }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      object-position: top;
      background: #f5f5f5;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .card img:hover { opacity: 0.85; }

    .card-body { padding: 16px; }
    .card-body h3 { font-size: 1rem; color: #ffffff; margin-bottom: 4px; }
    .card-body .issuer { color: #a0a8c0; font-size: 0.85rem; margin-bottom: 8px; }

    .badge {
      display: inline-block;
      background: #1e3a5f;
      color: #4f8ef7;
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .card-body a {
      display: inline-block;
      color: #4f8ef7;
      font-size: 0.85rem;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .card-body a:hover { border-color: #4f8ef7; }

    .no-link { color: #555; font-size: 0.85rem; }
  </style>
</head>
<body>

  <!-- Profile -->
  <div class="hero" id="hero">
    <img id="profile-photo" src="" alt="Profile Photo" />
    <h1 id="name">Loading...</h1>
    <p class="title" id="title"></p>
    <p class="bio" id="bio"></p>
    <div class="links" id="links"></div>
  </div>

  <!-- Certificates -->
  <div class="section">
    <h2>Certifications & Education</h2>
    <div class="cards" id="cards">Loading...</div>
  </div>

  <script>
    const IMAGES_API = "";
    const CERTS_API  = "/api/backend";

    async function loadProfile() {
      const res  = await fetch(`${CERTS_API}/profile`);
      const data = await res.json();

      document.getElementById("profile-photo").src = `${IMAGES_API}/images/${data.photo_filename}`;
      document.getElementById("name").textContent  = data.name;
      document.getElementById("title").textContent = data.title;
      document.getElementById("bio").textContent   = data.bio;

      const links = document.getElementById("links");
      if (data.github_url)   links.innerHTML += `<a href="${data.github_url}" target="_blank">GitHub</a>`;
      if (data.linkedin_url) links.innerHTML += `<a href="${data.linkedin_url}" target="_blank">LinkedIn</a>`;
    }

    async function loadCerts() {
      const res   = await fetch(`${CERTS_API}/certificates`);
      const certs = await res.json();
      const cards = document.getElementById("cards");
      cards.innerHTML = "";

      certs.forEach(cert => {
        const imgTag = cert.image_filename
          ? `<a href="${IMAGES_API}/images/${cert.image_filename}" target="_blank">
               <img src="${IMAGES_API}/images/${cert.image_filename}" alt="${cert.name}" />
             </a>`
          : `<div style="height:200px;background:#111;display:flex;align-items:center;justify-content:center;color:#555;">No Image</div>`;

        const linkTag = cert.verification_url
          ? `<a href="${cert.verification_url}" target="_blank">Verify Certificate →</a>`
          : `<span class="no-link">No verification link</span>`;

        cards.innerHTML += `
          <div class="card">
            ${imgTag}
            <div class="card-body">
              <h3>${cert.name}</h3>
              <p class="issuer">${cert.issuer}</p>
              <span class="badge">${cert.category}</span><br/>
              ${linkTag}
            </div>
          </div>`;
      });
    }

    loadProfile();
    loadCerts();
  </script>

</body>
</html>
