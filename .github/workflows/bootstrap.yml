name: Bootstrap Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  aws_region: us-west-2
  terraform_version: 1.5.7
  vpc_name: eksdemo-vpc
  TF_VAR_DB_PASS: ${{ secrets.DB_PASS }}

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Trivy IaC scan (config + secret)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra/
          scanners: config,secret
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

  bootstrap:
    runs-on: ubuntu-latest
    needs: trivy-scan

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.terraform_version }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.aws_region }}
          role-session-name: github-actions

      - name: Terraform Init
        run: |
          cd infra
          terraform init -upgrade

      - name: Terraform Apply
        id: apply_step
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          cd infra
          terraform apply -auto-approve

      - name: Install ALB Controller
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          aws eks update-kubeconfig --region ${{ env.aws_region }} --name eksdemo-cluster

          ALB_ROLE_ARN=$(aws iam get-role --role-name eks-lb-controller-role --query 'Role.Arn' --output text)
          VPC_ID=$(aws eks describe-cluster --name eksdemo-cluster --query 'cluster.resourcesVpcConfig.vpcId' --output text)

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --version 1.12.0 \
            --set clusterName=eksdemo-cluster \
            --set region=${{ env.aws_region }} \
            --set vpcId=$VPC_ID \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=$ALB_ROLE_ARN \
            --wait --timeout 5m

      - name: Terraform Destroy (manual)
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          cd infra
          terraform destroy -auto-approve

      # Uncomment to auto-destroy on apply failure
      # - name: Destroy on failure
      #   if: ${{ failure() && github.event.inputs.action == 'apply' }}
      #   run: |
      #     echo "Terraform Apply FAILED — running destroy!"
      #     cd infra
      #     terraform destroy -auto-approve
