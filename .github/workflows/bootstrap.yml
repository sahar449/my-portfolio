name: Bootstrap Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  aws_region: us-west-2
  terraform_version: 1.5.7
  vpc_name: eksdemo-vpc
  TF_VAR_DB_PASS: ${{ secrets.DB_PASS }}

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Trivy IaC scan (config + secret)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra/
          scanners: config,secret
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

  bootstrap:
    runs-on: ubuntu-latest
    needs: trivy-scan

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.terraform_version }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.aws_region }}
          role-session-name: github-actions

      - name: Terraform Init
        run: |
          cd infra
          terraform init -upgrade

      - name: Terraform Apply
        id: apply_step
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          cd infra
          terraform apply -auto-approve

      - name: Cleanup all VPC resources
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ env.vpc_name }}" \
            --query "Vpcs[0].VpcId" --output text)
          echo "VPC: $VPC_ID"

          echo "=== Load balancers ==="
          LB_ARNS=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" --output text)
          for arn in $LB_ARNS; do
            echo "Deleting LB: $arn"
            aws elbv2 delete-load-balancer --load-balancer-arn "$arn" || true
          done
          [ -n "$LB_ARNS" ] && sleep 15

          echo "=== Target groups ==="
          TG_ARNS=$(aws elbv2 describe-target-groups \
            --query "TargetGroups[?VpcId=='$VPC_ID'].TargetGroupArn" --output text)
          for arn in $TG_ARNS; do
            echo "Deleting TG: $arn"
            aws elbv2 delete-target-group --target-group-arn "$arn" || true
          done

          echo "=== Non-default security groups ==="
          SGS=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[?GroupName!='default'].GroupId" --output text)
          for sg in $SGS; do
            echo "Deleting SG: $sg"
            aws ec2 delete-security-group --group-id "$sg" || true
          done

          echo "=== Available network interfaces ==="
          ENIS=$(aws ec2 describe-network-interfaces \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "NetworkInterfaces[?Status=='available'].NetworkInterfaceId" --output text)
          for eni in $ENIS; do
            echo "Deleting ENI: $eni"
            aws ec2 delete-network-interface --network-interface-id "$eni" || true
          done

      - name: Terraform Destroy (manual)
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          cd infra
          terraform destroy -auto-approve

      # Uncomment to auto-destroy on apply failure
      # - name: Destroy on failure
      #   if: ${{ failure() && github.event.inputs.action == 'apply' }}
      #   run: |
      #     echo "Terraform Apply FAILED — running destroy!"
      #     cd infra
      #     terraform destroy -auto-approve
