name: CI Build & Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'services/**'
  workflow_run:
    workflows: ["Bootstrap Infra"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # Job 1: TRIVY SCAN (frontend + backend in parallel)
  # ============================================
  trivy-scan-frontend:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan — frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./services/frontend
          scanners: vuln,secret,config
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

  trivy-scan-backend:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan — backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./services/backend
          scanners: vuln,secret,config
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

  # ============================================
  # Job 2: BUILD & PUSH (frontend + backend in parallel)
  # ============================================
  build-frontend:
    runs-on: ubuntu-latest
    needs: trivy-scan-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-frontend

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./services/frontend
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/frontend:${{ env.IMAGE_TAG }}
            ${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/frontend:latest

      - name: Trivy image scan — frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/frontend:${{ env.IMAGE_TAG }}
          scanners: vuln,secret,config
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Generate SBOM — frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/frontend:${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: sbom-frontend.cdx.json
          exit-code: '0'

      - name: Upload SBOM — frontend
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: sbom-frontend.cdx.json

  build-backend:
    runs-on: ubuntu-latest
    needs: trivy-scan-backend
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-backend

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push backend
        uses: docker/build-push-action@v4
        with:
          context: ./services/backend
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend:${{ env.IMAGE_TAG }}
            ${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend:latest

      - name: Trivy image scan — backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend:${{ env.IMAGE_TAG }}
          scanners: vuln,secret,config
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Generate SBOM — backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend:${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: sbom-backend.cdx.json
          exit-code: '0'

      - name: Upload SBOM — backend
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: sbom-backend.cdx.json

  # ============================================
  # Job 3: SMOKE TEST (frontend + backend in parallel)
  # ============================================
  smoke-test-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-smoketest-frontend

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Start frontend container
        run: |
          docker run -d --name test-frontend -p 5000:5000 \
            ${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/frontend:${{ env.IMAGE_TAG }}

      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/health && break
            echo "Attempt $i/15 — not ready yet"
            [ "$i" -eq 15 ] && docker logs test-frontend && exit 1
            sleep 2
          done

      - name: Smoke Test — frontend
        uses: jtalk/url-health-check-action@v4
        with:
          url: http://localhost:5000/health
          max-attempts: 3
          retry-delay: 3s

      - name: Cleanup frontend container
        if: always()
        run: docker rm -f test-frontend 2>/dev/null || true

  smoke-test-backend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-smoketest-backend

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Start backend container
        run: |
          docker run -d --name test-backend -p 5002:5002 \
            ${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend:${{ env.IMAGE_TAG }}

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5002/health && break
            echo "Attempt $i/15 — not ready yet"
            [ "$i" -eq 15 ] && docker logs test-backend && exit 1
            sleep 2
          done

      - name: Smoke Test — backend
        uses: jtalk/url-health-check-action@v4
        with:
          url: http://localhost:5002/health
          max-attempts: 3
          retry-delay: 3s

      - name: Cleanup backend container
        if: always()
        run: docker rm -f test-backend 2>/dev/null || true
