name: EKS Infrastructure Management

on:
  workflow_run:
    workflows: ["CI Build & Test"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: write

env:
  # Environment settings from GitHub Actions Variables (Settings > Secrets and variables >
  # Actions > Variables). The values after || are fallbacks when a variable isn't set.
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'eksdemo-cluster' }}
  NAME_PREFIX: ${{ vars.NAME_PREFIX || 'eksdemo' }}
  VPC_NAME: ${{ vars.NAME_PREFIX || 'eksdemo' }}-vpc
  # AWS account ID from the GitHub Actions variable (Settings > Secrets and variables > Actions).
  # Falls back to a repository secret with the same name, if that's where it is stored.
  AWS_ACCOUNT_NUMBER: ${{ vars.AWS_ACCOUNT_NUMBER || secrets.AWS_ACCOUNT_NUMBER }}
  # Same settings passed to Terraform, so it never disagrees with the workflows
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-west-2' }}
  TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME || 'eksdemo-cluster' }}
  TF_VAR_name_prefix: ${{ vars.NAME_PREFIX || 'eksdemo' }}

jobs:
  # ============================================
  # Job 0: TRIVY SCAN
  # ============================================
  trivy-scan:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy scan ArgoCD manifests (config + secret)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ArgoCD/
          scanners: config,secret
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

  # ============================================
  # Job 1: APPLY (Deploy)
  # ============================================
  apply:
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') ||
      github.event_name == 'workflow_run'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-apply

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Configure aws-auth
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: aws-auth
            namespace: kube-system
          data:
            mapUsers: |
              - userarn: arn:aws:iam::${{ env.AWS_ACCOUNT_NUMBER }}:user/${{ secrets.AWS_USER }}
                username: ${{ secrets.AWS_USER }}
                groups:
                  - system:masters
          EOF

      - name: Install ArgoCD via Helm
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --version 7.8.23 \
            --wait \
            --timeout 10m \
            -f ArgoCD/argocd-server-values.yaml
          kubectl patch ingress argocd-server -n argocd --type=json -p='[
            {"op":"replace","path":"/spec/rules/0/host","value":"argocd.saharbittman.com"},
            {"op":"replace","path":"/spec/tls/0/hosts/0","value":"*.saharbittman.com"}
          ]' 2>/dev/null || true
          echo "ArgoCD URL: https://argocd.saharbittman.com"
          echo "ArgoCD password: $(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 --decode)"

      # Cluster-specific facts (account ID, VPC ID) never go to Git. They are stored on the
      # Argo CD cluster Secret, and the ApplicationSets read them from there (cluster generator).
      - name: Register cluster info in Argo CD
        run: |
          if [ -z "$AWS_ACCOUNT_NUMBER" ]; then
            echo "::error::AWS_ACCOUNT_NUMBER is not set (add it under Settings > Secrets and variables > Actions)"
            exit 1
          fi
          VPC_ID=$(aws eks describe-cluster \
            --name ${{ env.CLUSTER_NAME }} \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text)
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: in-cluster
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: cluster
              portfolio/cluster: "true"
            annotations:
              aws_account_id: "${{ env.AWS_ACCOUNT_NUMBER }}"
              aws_region: "${{ env.AWS_REGION }}"
              cluster_name: "${{ env.CLUSTER_NAME }}"
              vpc_id: "${VPC_ID}"
          type: Opaque
          stringData:
            name: in-cluster
            server: https://kubernetes.default.svc
            config: '{"tlsClientConfig":{"insecure":false}}'
          EOF

      - name: Update image tag in Git
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"

          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git pull --rebase

          if [ -z "${IMAGE_TAG}" ]; then
            IMAGE_TAG=$(aws ecr describe-images \
              --repository-name frontend \
              --region ${{ env.AWS_REGION }} \
              --query 'sort_by(imageDetails, &imagePushedAt)[-1].imageTags' \
              --output json | jq -r '.[] | select(. != "latest")' | head -1)
            echo "Manual trigger — latest ECR tag: ${IMAGE_TAG}"
          else
            echo "CI trigger — using tag: ${IMAGE_TAG}"
          fi

          yq e ".app.image.tag = \"${IMAGE_TAG}\"" \
            -i ArgoCD/frontend/helm_chart/values.yaml
          yq e ".app.image.tag = \"${IMAGE_TAG}\"" \
            -i ArgoCD/backend/helm_chart/values.yaml

          git add ArgoCD/frontend/helm_chart/values.yaml \
                  ArgoCD/backend/helm_chart/values.yaml
          git diff --staged --quiet || git commit -m "ci: update image tag ${IMAGE_TAG}"
          git push

      - name: Apply root Application
        run: kubectl apply -f ArgoCD/root-app.yaml

      - name: Wait for all applications
        run: |
          APPS="aws-load-balancer-controller external-dns metrics-server kube-state-metrics secrets-store-csi-driver-provider-aws frontend backend"
          for i in $(seq 1 40); do
            PENDING=""
            for app in $APPS; do
              STATUS=$(kubectl get application "$app" -n argocd \
                -o jsonpath='{.status.health.status}' 2>/dev/null || true)
              [ "$STATUS" = "Healthy" ] || PENDING="$PENDING $app=${STATUS:-NotFound}"
            done
            if [ -z "$PENDING" ]; then
              echo "All applications are healthy"
              kubectl get applications -n argocd
              break
            fi
            echo "Attempt $i/40 — waiting for:$PENDING"
            if [ "$i" -eq 40 ]; then
              echo "Timeout waiting for applications"
              kubectl get applications -n argocd
              exit 1
            fi
            sleep 15
          done

      - name: Smoke Test
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://www.saharbittman.com/health
          max-attempts: 30
          retry-delay: 30s

  # ============================================
  # Job 2: DESTROY
  # ============================================
  destroy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-destroy

      - name: Update kubeconfig
        continue-on-error: true
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Remove ArgoCD finalizers and delete root Application
        continue-on-error: true
        run: |
          for app in $(kubectl get applications -n argocd -o name 2>/dev/null); do
            kubectl patch $app -n argocd \
              -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          done
          kubectl delete application root -n argocd --wait=false --ignore-not-found
          kubectl delete applicationset portfolio cluster-addons -n argocd \
            --wait=false --ignore-not-found
          kubectl delete ingress --all --all-namespaces --wait=false --ignore-not-found

      - name: Wait for ALBs — force delete if needed
        continue-on-error: true
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ env.VPC_NAME }}" \
            --query "Vpcs[0].VpcId" --output text)

          for i in $(seq 1 20); do
            LB_ARNS=$(aws elbv2 describe-load-balancers \
              --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" \
              --output text)
            if [ -z "$LB_ARNS" ]; then
              echo "All ALBs deleted"
              break
            fi
            echo "Attempt $i/20 — ALBs still exist..."
            if [ "$i" = "10" ]; then
              echo "Force deleting remaining ALBs via AWS CLI..."
              echo "$LB_ARNS" | tr '\t' '\n' | while read arn; do
                aws elbv2 delete-load-balancer --load-balancer-arn "$arn" || true
              done
            fi
            sleep 15
          done

      - name: Uninstall ArgoCD
        run: helm uninstall argocd -n argocd || true

  # ============================================
  # Job 3: DESTROY TERRAFORM
  # ============================================
  destroy-bootstrap:
    needs: destroy
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-destroy

      - name: Pre-clean externally-created resources
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ env.VPC_NAME }}" \
            --query "Vpcs[0].VpcId" --output text)
          echo "VPC: $VPC_ID"
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "VPC not found, skipping pre-clean"
            exit 0
          fi

          echo "=== Delete remaining ALBs and wait until gone ==="
          LB_ARNS=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" --output text)
          for arn in $LB_ARNS; do
            echo "Deleting LB: $arn"
            aws elbv2 delete-load-balancer --load-balancer-arn "$arn" || true
          done
          if [ -n "$LB_ARNS" ]; then
            echo "Polling until all ALBs are gone..."
            for i in $(seq 1 20); do
              REMAINING=$(aws elbv2 describe-load-balancers \
                --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" --output text)
              [ -z "$REMAINING" ] && echo "All ALBs deleted" && break
              echo "Still waiting for ALBs... ($i/20)"
              sleep 15
            done
            echo "Waiting 30s for listener deregistration to complete..."
            sleep 30
          fi

          echo "=== Delete target groups ==="
          TG_ARNS=$(aws elbv2 describe-target-groups \
            --query "TargetGroups[?VpcId=='$VPC_ID'].TargetGroupArn" --output text)
          for arn in $TG_ARNS; do
            echo "Deleting TG: $arn"
            aws elbv2 delete-target-group --target-group-arn "$arn" || true
          done

          echo "=== Delete security groups created by the ALB controller (not in Terraform state) ==="
          K8S_SGS=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag-key,Values=elbv2.k8s.aws/cluster" \
            --query "SecurityGroups[*].GroupId" --output text)
          for sg in $K8S_SGS; do
            # Remove rules in other SGs (e.g. node SG) that reference this SG, otherwise delete fails
            for ref in $(aws ec2 describe-security-group-rules \
                --filters "Name=referenced-group-id,Values=$sg" \
                --query "SecurityGroupRules[*].[GroupId,SecurityGroupRuleId,IsEgress]" --output text | tr '\t' ',' ); do
              IFS=',' read -r owner rule egress <<< "$ref"
              if [ "$egress" = "True" ]; then
                aws ec2 revoke-security-group-egress --group-id "$owner" --security-group-rule-ids "$rule" || true
              else
                aws ec2 revoke-security-group-ingress --group-id "$owner" --security-group-rule-ids "$rule" || true
              fi
            done
          done
          for sg in $K8S_SGS; do
            echo "Deleting k8s SG: $sg"
            aws ec2 delete-security-group --group-id "$sg" || true
          done

          echo "=== Delete available ENIs ==="
          ENIS=$(aws ec2 describe-network-interfaces \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=status,Values=available" \
            --query "NetworkInterfaces[*].NetworkInterfaceId" --output text)
          for eni in $ENIS; do
            echo "Deleting ENI: $eni"
            aws ec2 delete-network-interface --network-interface-id "$eni" || true
          done

          echo "=== Delete VPC Endpoints ==="
          ENDPOINTS=$(aws ec2 describe-vpc-endpoints \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "VpcEndpoints[?State!='deleted'].VpcEndpointId" --output text)
          for ep in $ENDPOINTS; do
            echo "Deleting endpoint: $ep"
            aws ec2 delete-vpc-endpoints --vpc-endpoint-ids "$ep" || true
          done

          echo "=== Delete NAT Gateways and poll until fully deleted ==="
          NATS=$(aws ec2 describe-nat-gateways \
            --filter "Name=vpc-id,Values=$VPC_ID" \
            --query "NatGateways[?State!='deleted'].NatGatewayId" --output text)
          for nat in $NATS; do
            echo "Deleting NAT: $nat"
            aws ec2 delete-nat-gateway --nat-gateway-id "$nat" || true
          done
          if [ -n "$NATS" ]; then
            echo "Polling until all NAT gateways are fully deleted (takes 60-120s)..."
            for i in $(seq 1 20); do
              REMAINING=$(aws ec2 describe-nat-gateways \
                --filter "Name=vpc-id,Values=$VPC_ID" \
                --query "NatGateways[?State!='deleted'].NatGatewayId" --output text)
              [ -z "$REMAINING" ] && echo "All NAT gateways deleted" && break
              echo "Still waiting for NAT gateways... ($i/20)"
              sleep 15
            done
          fi

          echo "=== Release EIPs freed by NAT gateway deletion ==="
          EIPS=$(aws ec2 describe-addresses \
            --filters "Name=domain,Values=vpc" \
            --query "Addresses[?AssociationId==null].AllocationId" --output text)
          for eip in $EIPS; do
            echo "Releasing EIP: $eip"
            aws ec2 release-address --allocation-id "$eip" || true
          done

      - name: Terraform Destroy
        id: tf_destroy
        continue-on-error: true
        run: |
          cd infra
          terraform init -upgrade
          terraform destroy -auto-approve

      - name: Post-cleanup orphaned VPC resources (if any remain after Terraform)
        if: always()
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ env.VPC_NAME }}" \
            --query "Vpcs[0].VpcId" --output text)
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "VPC already deleted by Terraform — nothing to clean up"
            exit 0
          fi
          echo "VPC $VPC_ID still exists — cleaning up orphaned resources..."

          echo "=== Revoke and delete security groups ==="
          SGS=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[?GroupName!='default'].GroupId" --output text)
          for sg in $SGS; do
            INGRESS=$(aws ec2 describe-security-groups --group-ids "$sg" \
              --query "SecurityGroups[0].IpPermissions" --output json)
            EGRESS=$(aws ec2 describe-security-groups --group-ids "$sg" \
              --query "SecurityGroups[0].IpPermissionsEgress" --output json)
            [ "$INGRESS" != "[]" ] && \
              aws ec2 revoke-security-group-ingress --group-id "$sg" \
                --ip-permissions "$INGRESS" 2>/dev/null || true
            [ "$EGRESS" != "[]" ] && \
              aws ec2 revoke-security-group-egress --group-id "$sg" \
                --ip-permissions "$EGRESS" 2>/dev/null || true
          done
          for sg in $SGS; do
            echo "Deleting SG: $sg"
            aws ec2 delete-security-group --group-id "$sg" || true
          done

          echo "=== Delete available ENIs ==="
          ENIS=$(aws ec2 describe-network-interfaces \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=status,Values=available" \
            --query "NetworkInterfaces[*].NetworkInterfaceId" --output text)
          for eni in $ENIS; do
            echo "Deleting ENI: $eni"
            aws ec2 delete-network-interface --network-interface-id "$eni" || true
          done

          echo "=== Detach and delete Internet Gateways ==="
          IGWS=$(aws ec2 describe-internet-gateways \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query "InternetGateways[*].InternetGatewayId" --output text)
          for igw in $IGWS; do
            echo "Detaching and deleting IGW: $igw"
            aws ec2 detach-internet-gateway --internet-gateway-id "$igw" --vpc-id "$VPC_ID" || true
            aws ec2 delete-internet-gateway --internet-gateway-id "$igw" || true
          done

          echo "=== Delete subnets ==="
          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "Subnets[*].SubnetId" --output text)
          for subnet in $SUBNETS; do
            echo "Deleting subnet: $subnet"
            aws ec2 delete-subnet --subnet-id "$subnet" || true
          done

          echo "=== Delete non-main route tables ==="
          RTS=$(aws ec2 describe-route-tables \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "RouteTables[?Associations[?Main!=\`true\`] || !Associations].RouteTableId" \
            --output text)
          for rt in $RTS; do
            echo "Deleting RT: $rt"
            aws ec2 delete-route-table --route-table-id "$rt" || true
          done

          echo "=== Delete VPC ==="
          aws ec2 delete-vpc --vpc-id "$VPC_ID" || true

      - name: Terraform Destroy (retry after cleanup)
        if: steps.tf_destroy.outcome == 'failure'
        run: |
          cd infra
          terraform destroy -auto-approve

      - name: Delete leftover CloudWatch log groups (so the next apply doesn't hit "already exists")
        if: always()
        run: |
          for prefix in "/aws/containerinsights/${{ env.CLUSTER_NAME }}/" "/elasticache/${{ env.NAME_PREFIX }}/" "/aws/rds/instance/mydb/" "/aws/application-signals/"; do
            for lg in $(aws logs describe-log-groups --log-group-name-prefix "$prefix" \
                --query "logGroups[*].logGroupName" --output text); do
              echo "Deleting log group: $lg"
              aws logs delete-log-group --log-group-name "$lg" || true
            done
          done

      - name: Delete DNS records left by external-dns (next apply points them at the new ALBs)
        if: always()
        run: |
          ZONE_ID=$(aws route53 list-hosted-zones-by-name --dns-name saharbittman.com \
            --query "HostedZones[0].Id" --output text)
          # Only www/argocd records (A/AAAA/CNAME + external-dns TXT ownership records, e.g. a-www...).
          # Apex, MX and ACM validation records are left alone.
          aws route53 list-resource-record-sets --hosted-zone-id "$ZONE_ID" --output json \
            | jq -c '.ResourceRecordSets[]
                | select(.Type == "A" or .Type == "AAAA" or .Type == "CNAME" or .Type == "TXT")
                | select(.Name | test("^([a-z]+-)?(www|argocd)\\.saharbittman\\.com\\.$"))' \
            | while read -r rr; do
                echo "Deleting $(echo "$rr" | jq -r '.Type + " " + .Name')"
                aws route53 change-resource-record-sets --hosted-zone-id "$ZONE_ID" \
                  --change-batch "{\"Changes\":[{\"Action\":\"DELETE\",\"ResourceRecordSet\":$rr}]}" || true
              done
