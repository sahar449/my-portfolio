name: EKS Infrastructure Management

on:
  workflow_run:
    workflows: ["CI Build & Test"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  CLUSTER_NAME: eksdemo-cluster
  VPC_NAME: eksdemo-vpc

jobs:
  # ============================================
  # Job 0: TRIVY SCAN
  # ============================================
  trivy-scan:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy scan ArgoCD manifests (config + secret)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ArgoCD/
          scanners: config,secret
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

  # ============================================
  # Job 1: APPLY (Deploy)
  # ============================================
  apply:
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') ||
      github.event_name == 'workflow_run'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-apply

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Configure aws-auth
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: aws-auth
            namespace: kube-system
          data:
            mapUsers: |
              - userarn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_NUMBER }}:user/${{ secrets.AWS_USER }}
                username: ${{ secrets.AWS_USER }}
                groups:
                  - system:masters
          EOF

      - name: Install ArgoCD via Helm
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --version 7.8.23 \
            --wait \
            --timeout 10m \
            -f ArgoCD/argocd-values.yaml
          kubectl patch ingress argocd-server -n argocd --type=json -p='[
            {"op":"replace","path":"/spec/rules/0/host","value":"argocd.saharbittman.com"},
            {"op":"replace","path":"/spec/tls/0/hosts/0","value":"*.saharbittman.com"}
          ]' 2>/dev/null || true
          echo "ArgoCD URL: https://argocd.saharbittman.com"
          echo "ArgoCD password: $(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 --decode)"

      - name: Deploy ALB Ingress Controller ApplicationSet
        run: |
          export VPC_ID=$(aws eks describe-cluster \
            --name ${{ env.CLUSTER_NAME }} \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text)
          export AWS_ACCOUNT_NUMBER=${{ secrets.AWS_ACCOUNT_NUMBER }}

          envsubst < ArgoCD/alb-ingress-controller-applicationset.yaml | kubectl apply -f -

          echo "Waiting for ArgoCD to sync alb-controller application..."
          for i in $(seq 1 30); do
            HEALTH=$(kubectl get application alb-controller -n argocd \
              -o jsonpath='{.status.health.status}' 2>/dev/null || echo "NotFound")
            SYNC=$(kubectl get application alb-controller -n argocd \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "NotFound")
            echo "Attempt $i/30 — health: $HEALTH, sync: $SYNC"
            if [ "$HEALTH" = "Healthy" ] && [ "$SYNC" = "Synced" ]; then
              echo "ALB controller is healthy and synced"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Timeout waiting for alb-controller to be healthy"
              exit 1
            fi
            sleep 15
          done

      - name: Deploy portfolio ApplicationSet
        run: |
          export ECR_FRONTEND=${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/frontend
          export ECR_BACKEND=${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend
          export AWS_ACCOUNT_NUMBER=${{ secrets.AWS_ACCOUNT_NUMBER }}
          export IMAGE_TAG=${{ github.event.workflow_run.head_sha || github.sha }}

          envsubst < ArgoCD/applicationset.yaml | kubectl apply -f -

          echo "ArgoCD Applications:"
          kubectl get applications -n argocd

      - name: Smoke Test
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://www.saharbittman.com/health
          max-attempts: 30
          retry-delay: 30s

  # ============================================
  # Job 2: DESTROY
  # ============================================
  destroy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-destroy

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Remove ArgoCD finalizers
        run: |
          for app in $(kubectl get applications -n argocd -o name 2>/dev/null); do
            kubectl patch $app -n argocd \
              -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          done

      - name: Delete portfolio ApplicationSet and ingresses
        run: |
          kubectl delete applicationset portfolio -n argocd --wait=false --ignore-not-found
          kubectl delete ingress --all --all-namespaces --wait=false --ignore-not-found
          kubectl delete applications frontend backend -n argocd --wait=false --ignore-not-found

      - name: Wait for ALBs — force delete if needed
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ env.VPC_NAME }}" \
            --query "Vpcs[0].VpcId" --output text)

          for i in $(seq 1 20); do
            LB_ARNS=$(aws elbv2 describe-load-balancers \
              --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" \
              --output text)
            if [ -z "$LB_ARNS" ]; then
              echo "All ALBs deleted"
              break
            fi
            echo "Attempt $i/20 — ALBs still exist..."
            if [ "$i" = "10" ]; then
              echo "Force deleting remaining ALBs via AWS CLI..."
              echo "$LB_ARNS" | tr '\t' '\n' | while read arn; do
                aws elbv2 delete-load-balancer --load-balancer-arn "$arn" || true
              done
            fi
            sleep 15
          done

      - name: Delete ALB controller ApplicationSet
        run: |
          kubectl patch application alb-controller -n argocd \
            -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          kubectl delete applicationset alb-ingress-controller -n argocd \
            --wait=false --ignore-not-found

      - name: Uninstall ArgoCD
        run: helm uninstall argocd -n argocd || true

  # ============================================
  # Job 3: DESTROY TERRAFORM
  # ============================================
  destroy-bootstrap:
    needs: destroy
    runs-on: ubuntu-latest
    if: needs.destroy.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-destroy

      - name: Cleanup all VPC resources
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ env.VPC_NAME }}" \
            --query "Vpcs[0].VpcId" --output text)
          echo "VPC: $VPC_ID"
          [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ] && echo "VPC not found, skipping" && exit 0

          echo "=== Load balancers ==="
          LB_ARNS=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn" --output text)
          for arn in $LB_ARNS; do
            echo "Deleting LB: $arn"
            aws elbv2 delete-load-balancer --load-balancer-arn "$arn" || true
          done
          [ -n "$LB_ARNS" ] && sleep 20

          echo "=== Target groups ==="
          TG_ARNS=$(aws elbv2 describe-target-groups \
            --query "TargetGroups[?VpcId=='$VPC_ID'].TargetGroupArn" --output text)
          for arn in $TG_ARNS; do
            aws elbv2 delete-target-group --target-group-arn "$arn" || true
          done

          echo "=== VPC Endpoints ==="
          ENDPOINTS=$(aws ec2 describe-vpc-endpoints \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "VpcEndpoints[?State!='deleted'].VpcEndpointId" --output text)
          for ep in $ENDPOINTS; do
            echo "Deleting endpoint: $ep"
            aws ec2 delete-vpc-endpoints --vpc-endpoint-ids "$ep" || true
          done

          echo "=== NAT Gateways ==="
          NATS=$(aws ec2 describe-nat-gateways \
            --filter "Name=vpc-id,Values=$VPC_ID" \
            --query "NatGateways[?State!='deleted'].NatGatewayId" --output text)
          for nat in $NATS; do
            echo "Deleting NAT: $nat"
            aws ec2 delete-nat-gateway --nat-gateway-id "$nat" || true
          done
          [ -n "$NATS" ] && sleep 20

          echo "=== Revoke all SG rules (break circular deps) ==="
          SGS=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[?GroupName!='default'].GroupId" --output text)
          for sg in $SGS; do
            INGRESS=$(aws ec2 describe-security-groups --group-ids "$sg" \
              --query "SecurityGroups[0].IpPermissions" --output json)
            EGRESS=$(aws ec2 describe-security-groups --group-ids "$sg" \
              --query "SecurityGroups[0].IpPermissionsEgress" --output json)
            [ "$INGRESS" != "[]" ] && \
              aws ec2 revoke-security-group-ingress --group-id "$sg" \
                --ip-permissions "$INGRESS" 2>/dev/null || true
            [ "$EGRESS" != "[]" ] && \
              aws ec2 revoke-security-group-egress --group-id "$sg" \
                --ip-permissions "$EGRESS" 2>/dev/null || true
          done

          echo "=== Delete security groups ==="
          for sg in $SGS; do
            echo "Deleting SG: $sg"
            aws ec2 delete-security-group --group-id "$sg" || true
          done

          echo "=== Network interfaces ==="
          ENIS=$(aws ec2 describe-network-interfaces \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "NetworkInterfaces[?Status=='available'].NetworkInterfaceId" --output text)
          for eni in $ENIS; do
            echo "Deleting ENI: $eni"
            aws ec2 delete-network-interface --network-interface-id "$eni" || true
          done

          echo "=== Internet Gateways ==="
          IGWS=$(aws ec2 describe-internet-gateways \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query "InternetGateways[*].InternetGatewayId" --output text)
          for igw in $IGWS; do
            echo "Detaching and deleting IGW: $igw"
            aws ec2 detach-internet-gateway --internet-gateway-id "$igw" --vpc-id "$VPC_ID" || true
            aws ec2 delete-internet-gateway --internet-gateway-id "$igw" || true
          done

          echo "=== Subnets ==="
          SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "Subnets[*].SubnetId" --output text)
          for subnet in $SUBNETS; do
            echo "Deleting subnet: $subnet"
            aws ec2 delete-subnet --subnet-id "$subnet" || true
          done

          echo "=== Route tables (non-main) ==="
          RTS=$(aws ec2 describe-route-tables \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "RouteTables[?Associations[?Main!=\`true\`] || !Associations].RouteTableId" \
            --output text)
          for rt in $RTS; do
            echo "Deleting RT: $rt"
            aws ec2 delete-route-table --route-table-id "$rt" || true
          done

      - name: Terraform Destroy
        run: |
          cd infra
          terraform init -upgrade
          terraform destroy -auto-approve
