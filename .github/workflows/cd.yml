name: EKS Infrastructure Management

on:
  workflow_run:
    workflows: ["CI Build & Test"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  CLUSTER_NAME: eksdemo-cluster
  VPC_NAME: eksdemo-vpc

jobs:
  # ============================================
  # Job 0: TRIVY SCAN
  # ============================================
  trivy-scan:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') ||
      github.event_name == 'workflow_run'
    steps:
      - name: Verify CI succeeded
        if: github.event_name == 'workflow_run'
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          if [ "$CONCLUSION" != "success" ]; then
            echo "CI workflow did not succeed (conclusion: $CONCLUSION). Stopping CD."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy scan ArgoCD manifests (config + secret)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ArgoCD/
          scanners: config,secret
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

  # ============================================
  # Job 1: APPLY (Deploy)
  # ============================================
  apply:
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') ||
      github.event_name == 'workflow_run'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-apply

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Configure aws-auth
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: aws-auth
            namespace: kube-system
          data:
            mapUsers: |
              - userarn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_NUMBER }}:user/${{ secrets.AWS_USER }}
                username: ${{ secrets.AWS_USER }}
                groups:
                  - system:masters
          EOF

      - name: Install ArgoCD via Helm
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --version 7.8.23 \
            --wait \
            --timeout 10m \
            -f - <<EOF
          server:
            extraArgs:
              - --insecure
            service:
              type: ClusterIP
            ingress:
              enabled: true
              ingressClassName: alb
              annotations:
                kubernetes.io/ingress.class: alb
                alb.ingress.kubernetes.io/scheme: internet-facing
                alb.ingress.kubernetes.io/target-type: ip
                alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
                alb.ingress.kubernetes.io/ssl-redirect: '443'
                alb.ingress.kubernetes.io/healthcheck-path: /healthz
                alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
                alb.ingress.kubernetes.io/healthy-threshold-count: '2'
                alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
                alb.ingress.kubernetes.io/tags: ManagedBy=helm,Application=argocd,Environment=production
                alb.ingress.kubernetes.io/load-balancer-name: argocd-alb
                alb.ingress.kubernetes.io/load-balancer-attributes: deletion_protection.enabled=false
                alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=10
                external-dns.alpha.kubernetes.io/hostname: argocd.saharbittman.com
              hosts:
                - argocd.saharbittman.com
              tls:
                - hosts:
                    - '*.saharbittman.com'
          EOF

          echo "ArgoCD URL: https://argocd.saharbittman.com"
          echo "ArgoCD password: $(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 --decode)"

      - name: Deploy eks-charts ApplicationSet (ALB controller + external-dns)
        run: |
          export VPC_ID=$(aws eks describe-cluster \
            --name ${{ env.CLUSTER_NAME }} \
            --query 'cluster.resourcesVpcConfig.vpcId' \
            --output text)
          export AWS_ACCOUNT_NUMBER=${{ secrets.AWS_ACCOUNT_NUMBER }}

          envsubst < ArgoCD/eks-charts-applicationset.yaml | kubectl apply -f -

          echo "Waiting for ArgoCD to sync alb-controller application..."
          for i in $(seq 1 30); do
            HEALTH=$(kubectl get application alb-controller -n argocd \
              -o jsonpath='{.status.health.status}' 2>/dev/null || echo "NotFound")
            SYNC=$(kubectl get application alb-controller -n argocd \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "NotFound")
            echo "Attempt $i/30 — health: $HEALTH, sync: $SYNC"
            if [ "$HEALTH" = "Healthy" ] && [ "$SYNC" = "Synced" ]; then
              echo "ALB controller is healthy and synced"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Timeout waiting for alb-controller to be healthy"
              exit 1
            fi
            sleep 15
          done

      - name: Deploy portfolio ApplicationSet
        run: |
          export ECR_FRONTEND=${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/frontend
          export ECR_BACKEND=${{ secrets.AWS_ACCOUNT_NUMBER }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/backend
          export AWS_ACCOUNT_NUMBER=${{ secrets.AWS_ACCOUNT_NUMBER }}
          export IMAGE_TAG=${{ github.event.workflow_run.head_sha || github.sha }}

          envsubst < ArgoCD/applicationset.yaml | kubectl apply -f -

          echo "ArgoCD Applications:"
          kubectl get applications -n argocd

      - name: Smoke Test
        run: |
          URL="https://www.saharbittman.com/health"
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "App is live"
              exit 0
            fi
            echo "Attempt $i/30 - HTTP: $HTTP_CODE"
            sleep 30
          done
          echo "Smoke test failed"
          exit 1

  # ============================================
  # Job 2: DESTROY
  # ============================================
  destroy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-destroy

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Delete portfolio apps and ingresses
        run: |
          kubectl delete applicationset portfolio -n argocd --timeout=2m || true
          kubectl delete applications frontend backend -n argocd --timeout=2m || true
          kubectl delete ingress --all --all-namespaces || true

          # Force remove any stuck finalizers
          for app in frontend backend; do
            kubectl patch application $app -n argocd \
              -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          done

      - name: Wait for ALBs to be deleted
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${{ env.VPC_NAME }}" \
            --query "Vpcs[0].VpcId" --output text)

          for i in $(seq 1 24); do
            LB_COUNT=$(aws elbv2 describe-load-balancers \
              --query "LoadBalancers[?VpcId=='$VPC_ID'] | length(@)" \
              --output text)
            if [ "$LB_COUNT" = "0" ]; then
              echo "All ALBs deleted"
              break
            fi
            echo "Attempt $i/24 — $LB_COUNT ALB(s) remaining..."
            sleep 15
          done

      - name: Delete ALB controller and remaining apps
        run: |
          kubectl delete applicationset eks-charts-applications -n argocd --timeout=2m || true
          kubectl delete application alb-controller -n argocd --timeout=2m || true

      - name: Uninstall ArgoCD
        run: helm uninstall argocd -n argocd || true

  # ============================================
  # Job 3: DESTROY TERRAFORM
  # ============================================
  destroy-bootstrap:
    needs: destroy
    runs-on: ubuntu-latest
    if: needs.destroy.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform-destroy

      - name: Terraform Destroy
        run: |
          cd infra
          terraform init -upgrade
          terraform destroy -auto-approve
